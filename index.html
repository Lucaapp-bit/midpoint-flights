<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#E8EDED" />
<title>MidPoint, dove ci vediamo?</title>
<meta name="description" content="Siete in due città diverse? MidPoint trova la terza città dove incontrarvi spendendo meno in totale." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='16' r='9' fill='%23D9650A'/%3E%3Ccircle cx='21' cy='16' r='9' fill='%230B8A80' fill-opacity='.85'/%3E%3C/svg%3E" />
<link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
<style>
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-display:swap;src:url(/fonts/bricolage-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-display:swap;src:url(/fonts/bricolage-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --paper:#E8EDED; --surface:#F5F8F7; --sea:#D8E3E5;
  --ink:#12263A; --ink-2:#445669; --line:rgba(18,38,58,.16); --line-2:rgba(18,38,58,.42);
  --a:#D9650A; --b:#0B8A80; --err:#A3301F;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 0}
.brand-line{display:flex;align-items:baseline;gap:16px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:700;font-size:1.2rem;letter-spacing:-.01em}
.mark{position:relative;width:30px;height:20px;display:inline-block}
.mark i{position:absolute;top:0;width:20px;height:20px;border-radius:50%;mix-blend-mode:multiply}
.mark .ma{left:0;background:var(--a)}
.mark .mb{right:0;background:var(--b)}
.tag{color:var(--ink-2);font-size:.95rem}
.mode{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink-2)}
.mode::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--ink-2)}
.mode.live::before{background:var(--b);border-color:var(--b)}
.mode[hidden]{display:none}

/* ---------- the sentence (form) ---------- */
.ask{padding:clamp(36px,8vw,84px) 0 8px}
.ask-title{margin:0 0 clamp(20px,3vw,32px);font-weight:650;font-size:clamp(2rem,5.6vw,4.4rem);line-height:1.12;letter-spacing:-.028em}
.fld{position:relative;display:inline-block;max-width:100%}
.fld input{font:inherit;letter-spacing:inherit;color:inherit;background:transparent;border:0;border-bottom:.075em solid var(--c);border-radius:0;padding:0 .06em;margin:0;min-width:2.6em;max-width:100%}
.fld input::placeholder{color:rgba(18,38,58,.3);opacity:1}
.fld input:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:2px;background:rgba(255,255,255,.5)}
.fld.a{--c:var(--a)}
.fld.b{--c:var(--b)}

.options{list-style:none;margin:0;padding:6px;position:absolute;left:0;top:calc(100% + 12px);z-index:30;min-width:min(340px,calc(100vw - 48px));max-height:340px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 40px -20px rgba(18,38,58,.5);font-size:1rem;font-weight:400;letter-spacing:0;line-height:1.35;text-align:left}
.options li{display:block;padding:9px 12px;border-radius:7px;cursor:pointer}
.options li.active{background:rgba(18,38,58,.08)}
.options li.group{border-bottom:1px solid var(--line);border-radius:7px 7px 0 0;margin-bottom:4px}
.opt-city{display:block;font-weight:550}
.opt-meta{display:block;font-size:.84rem;color:var(--ink-2)}

.when .ln{display:block}
.when{margin:0 0 18px;max-width:56rem;font-size:clamp(1.1rem,2vw,1.45rem);line-height:1.85;font-weight:450;letter-spacing:-.005em}
.when input[type=date],.when input[type=number]{background:transparent;border:0;border-bottom:2px solid var(--line-2);border-radius:0;padding:0 2px;color-scheme:light;font-weight:600}
.when input[type=number]{width:7.6em;-moz-appearance:textfield;appearance:textfield}
.when input[type=number]::-webkit-inner-spin-button,.when input[type=number]::-webkit-outer-spin-button{display:none}
.when input:disabled{opacity:.4}
.t{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.22em;text-decoration-color:var(--ink)}
.t:hover{text-decoration-color:var(--a)}

.names{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 0 26px;color:var(--ink-2);font-size:.95rem}
.names label{display:inline-flex;align-items:center;gap:8px}
.sw{display:inline-block;width:18px;height:4px;border-radius:2px}
.sw.a{background:var(--a)}
.sw.b{background:var(--b)}
.names input{background:transparent;border:0;border-bottom:1px solid var(--line-2);border-radius:0;padding:2px 0;width:8.5em;color:var(--ink)}

.go{border:0;border-radius:8px;background:var(--ink);color:var(--paper);font-weight:650;font-size:1.1rem;padding:14px 26px;cursor:pointer}
.go:hover:not(:disabled){background:#0A1B2B}
.go:disabled{opacity:.38;cursor:not-allowed}
.warn{margin:12px 0 0;color:var(--err);font-size:.95rem}
.warn[hidden]{display:none}
.try{margin:20px 0 0;color:var(--ink-2);font-size:.95rem}
.try .t{color:var(--ink);font-weight:500}

/* ---------- map + results ---------- */
.board{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,4vw,56px);margin-top:clamp(40px,6vw,72px);padding-bottom:72px;align-items:start;scroll-margin-top:16px}
.pane{grid-column:1;grid-row:1}
.map-wrap{grid-column:2;grid-row:1;position:sticky;top:20px}
.map{position:relative;background:var(--sea);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.map svg{display:block;width:100%;height:auto;aspect-ratio:1000/660}
.map text{font-family:inherit;paint-order:stroke;stroke:#F3F6F4;stroke-linejoin:round}
.map text.tt{stroke:none}
.land{fill:#F3F6F4;stroke:rgba(18,38,58,.35);stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.borders{fill:none;stroke:rgba(18,38,58,.2);stroke-width:.7px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.zoom{position:absolute;right:10px;top:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.85rem;font-weight:550;color:var(--ink);cursor:pointer}
.zoom:hover{background:#fff}
.zoom[hidden]{display:none}
.thread{fill:none;stroke-linecap:round;stroke-dasharray:1}
.thread.draw{animation:draw .8s cubic-bezier(.3,.7,.2,1) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.cap{margin:12px 2px 0;color:var(--ink-2);font-size:.95rem;min-height:3em}
.cap strong{color:var(--ink);font-weight:650}

.pane-h{margin:0 0 14px;font-size:1.05rem;font-weight:550;line-height:1.4;max-width:34rem}
.pane-h small{display:block;margin-top:2px;color:var(--ink-2);font-weight:400;font-size:.9rem}
.list{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--line)}
.row{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:18px 16px 18px 18px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.4)}
.row[aria-pressed="true"]{background:var(--surface);box-shadow:inset 4px 0 0 var(--ink)}
.row-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.row-city{font-size:1.5rem;font-weight:650;letter-spacing:-.015em;line-height:1.15}
.row-country{display:block;font-size:.88rem;color:var(--ink-2)}
.best{display:inline-block;margin-left:10px;vertical-align:middle;background:var(--ink);color:var(--paper);font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:4px;letter-spacing:0}
.row-price{text-align:right;flex:none}
.row-total{display:block;font-size:1.6rem;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15}
.row-sub{display:block;font-size:.8rem;color:var(--ink-2)}
.leg{display:grid;grid-template-columns:18px 1fr auto;column-gap:10px;align-items:baseline;margin-top:12px;font-size:.95rem}
.leg-line{height:4px;border-radius:2px;align-self:center}
.leg.a .leg-line{background:var(--a)}
.leg.b .leg-line{background:var(--b)}
.leg-name{font-weight:550}
.leg-price{font-variant-numeric:tabular-nums;font-weight:600}
.leg-info{grid-column:2/-1;color:var(--ink-2);font-size:.85rem}
.split{display:flex;height:4px;border-radius:2px;overflow:hidden;margin:14px 0 6px;background:var(--line)}
.split i{display:block;height:100%}
.split .sa{background:var(--a)}
.split .sb{background:var(--b)}
.gap{display:block;font-size:.82rem;color:var(--ink-2)}

.hint-box{max-width:30rem;color:var(--ink-2)}
.hint-box p{margin:0 0 .8em}
.err{margin:0;border-left:3px solid var(--err);padding:4px 0 4px 14px;color:var(--err);max-width:30rem}
.sk{position:relative;height:112px;border-top:1px solid var(--line)}
.sk::before{content:"";position:absolute;left:18px;top:22px;width:46%;height:22px;background:rgba(18,38,58,.08);border-radius:4px;box-shadow:0 38px 0 -4px rgba(18,38,58,.06),0 62px 0 -4px rgba(18,38,58,.06)}
@media(prefers-reduced-motion:no-preference){.sk::before{animation:pulse 1.2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.5}}
@media(prefers-reduced-motion:reduce){.thread.draw{animation:none}}

.foot{border-top:1px solid var(--line);padding:22px 0 44px;display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;color:var(--ink-2);font-size:.88rem}

@media(max-width:900px){
  .board{grid-template-columns:1fr}
  .map-wrap{grid-column:1;grid-row:1;position:static}
  .pane{grid-column:1;grid-row:2}
}
@media(max-width:720px){.tag{display:none}}
@media(max-width:480px){.wrap{padding:0 18px}.row{padding-left:14px;padding-right:12px}}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
// MidPoint: vanilla JS, no build step. Talks to the /api/* functions on Vercel.

const API = {
  async search(q) {
    try {
      const r = await fetch(`/api/airports?q=${encodeURIComponent(q)}`);
      if (!r.ok) throw new Error();
      return await r.json();
    } catch { return []; }
  },
  async cities() {
    try {
      const r = await fetch("/api/airports?all=1");
      if (!r.ok) throw new Error();
      return await r.json();
    } catch { return []; }
  },
  async meeting(payload) {
    let r;
    try {
      r = await fetch("/api/meeting-points", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    } catch { throw new Error("Non riesco a contattare il server. Riprova tra un attimo."); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Qualcosa non ha funzionato. Riprova.");
    return d;
  },
  async provider() {
    try { const r = await fetch("/api/hello"); const j = await r.json(); state.testMode = !!j.testMode; return j.provider || null; }
    catch { return null; }
  }
};

const EXAMPLES = [
  ["Milano", "Londra"], ["Istanbul", "Parigi"], ["Roma", "New York"],
  ["Londra", "Dubai"], ["Madrid", "Buenos Aires"], ["Tokyo", "Sydney"]
];

// ---------- helpers ----------
const NS = "http://www.w3.org/2000/svg";
const fmt = (n, c = "EUR") => new Intl.NumberFormat("it-IT", { style: "currency", currency: c, maximumFractionDigits: 0 }).format(n);
const mins = m => m == null ? "durata n.d." : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`;
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) { if (kid == null) continue; e.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return e;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const todayISO = () => new Date().toISOString().slice(0, 10);
const plusDays = (base, n) => { const d = new Date(base); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- state ----------
// state.a / state.b hold the chosen option ({city, codes, ...}); textA/textB hold what is typed.
const state = {
  a: null, b: null, textA: "", textB: "", nameA: "Tu", nameB: "Lei / Lui",
  depart: plusDays(todayISO(), 30), ret: plusDays(todayISO(), 33),
  roundTrip: true, nonStop: false, budget: "",
  loading: false, error: "", data: null, sel: 0, provider: null, cities: [], mapMode: "fit"
};
const cityByCode = new Map();
const isLive = () => !!state.provider && !state.provider.startsWith("mock") && !state.testMode;
const sameCity = () => state.a && state.b && state.a.city === state.b.city;

let mapSvg = null, capEl = null, listEl = null;
const closers = new Set();
document.addEventListener("mousedown", e => closers.forEach(fn => fn(e)));

// width of an inline field follows its text
const fit = i => { const n = Math.max(4, (i.value || i.placeholder || "").length); i.style.width = (n * 0.5 + 0.45) + "em"; };

// ---------- city field with autocomplete ----------
function cityInput(side, placeholder, label, onChange) {
  const textKey = side === "a" ? "textA" : "textB";
  const wrap = el("span", { class: `fld ${side}` });
  const input = el("input", {
    type: "text", placeholder, autocomplete: "off", autocapitalize: "words", spellcheck: "false",
    "aria-label": label, role: "combobox", "aria-expanded": "false", "aria-autocomplete": "list"
  });
  input.value = state[textKey];
  fit(input);
  const list = el("ul", { class: "options", role: "listbox" });
  list.style.display = "none";
  let opts = [], active = 0, timer, seq = 0;

  const paintActive = () => [...list.children].forEach((li, i) => li.classList.toggle("active", i === active));
  const close = () => { opts = []; list.innerHTML = ""; list.style.display = "none"; input.setAttribute("aria-expanded", "false"); };
  const open = () => {
    list.innerHTML = "";
    if (!opts.length) { close(); return; }
    opts.forEach((o, i) => list.append(el("li", {
      role: "option", class: `${o.type === "city" ? "group" : ""}${i === active ? " active" : ""}`,
      onmousedown: e => { e.preventDefault(); pick(o); },
      onmouseenter: () => { active = i; paintActive(); }
    }, el("span", { class: "opt-city" }, o.label), el("span", { class: "opt-meta" }, o.sub))));
    list.style.display = "block"; list.style.left = "0";
    input.setAttribute("aria-expanded", "true");
    const over = list.getBoundingClientRect().right - (window.innerWidth - 12);
    if (over > 0) list.style.left = -over + "px";
  };
  const pick = o => { state[side] = o; state[textKey] = o.text; input.value = o.text; fit(input); close(); onChange("pick"); };
  const search = async q => { const my = ++seq; const r = await API.search(q); return my === seq ? r : null; };

  input.addEventListener("input", () => {
    state[side] = null; state[textKey] = input.value; fit(input); onChange("type");
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 2) { seq++; close(); return; }
    timer = setTimeout(async () => { const r = await search(q); if (r) { opts = r; active = 0; open(); } }, 150);
  });
  input.addEventListener("keydown", e => {
    if (!opts.length) return;
    if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(active + 1, opts.length - 1); paintActive(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(active - 1, 0); paintActive(); }
    else if (e.key === "Enter" || e.key === "Tab") { if (e.key === "Enter") e.preventDefault(); pick(opts[active]); }
    else if (e.key === "Escape") close();
  });
  // Left the field with text typed but nothing chosen: take the best match.
  input.addEventListener("blur", async () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (state[side] || q.length < 2) return;
    const r = await API.search(q);
    if (!state[side] && r.length && input.value.trim() === q) pick(r[0]);
  });
  closers.add(e => { if (!wrap.contains(e.target)) close(); });
  wrap.append(input, list);
  return wrap;
}

// ---------- results ----------
function legLine(side, name, l, currency) {
  return el("span", { class: `leg ${side}` },
    el("span", { class: "leg-line" }),
    el("span", { class: "leg-name" }, name),
    el("span", { class: "leg-price" }, fmt(l.price, currency)),
    el("span", { class: "leg-info" }, `da ${l.origin} a ${l.destination}, ${l.nonStop ? "diretto" : "con scalo"}, ${mins(l.durationMinutes)}`));
}
function row(it, i, labels) {
  const { destination: d, travelerA: A, travelerB: B, total, currency } = it;
  const share = (A.price / total) * 100;
  const sa = el("i", { class: "sa" }), sb = el("i", { class: "sb" });
  sa.style.width = share + "%"; sb.style.width = (100 - share) + "%";
  return el("li", {}, el("button", {
    type: "button", class: "row", "aria-pressed": String(i === state.sel), onclick: () => select(i)
  },
    el("span", { class: "row-head" },
      el("span", { class: "row-place" },
        el("span", { class: "row-city" }, d.city), i === 0 ? el("span", { class: "best" }, "la più economica") : null,
        el("span", { class: "row-country" }, d.country)),
      el("span", { class: "row-price" }, el("span", { class: "row-total" }, fmt(total, currency)), el("span", { class: "row-sub" }, "in due"))),
    legLine("a", labels.a, A, currency),
    legLine("b", labels.b, B, currency),
    el("span", { class: "split" }, sa, sb),
    el("span", { class: "gap" }, it.priceDiff === 0 ? "Spesa uguale" : `Differenza tra voi: ${fmt(it.priceDiff, currency)}`)));
}
function fillPane(pane) {
  listEl = null;
  if (state.error) { pane.append(el("p", { class: "err", role: "alert" }, state.error)); return; }
  if (state.loading) { const l = el("div", { class: "list" }); for (let i = 0; i < 3; i++) l.append(el("div", { class: "sk" })); pane.append(l); return; }
  if (!state.data) {
    pane.append(el("div", { class: "hint-box" },
      el("p", {}, "Scrivi le due città di partenza e le date. Cerco la terza città dove spendete meno in due."),
      el("p", {}, "Se una città ha più aeroporti li provo tutti: Milano vuol dire Malpensa, Linate e Bergamo.")));
    return;
  }
  const res = state.data.results;
  if (!res.length) {
    pane.append(el("p", { class: "hint-box" }, "Nessuna città raggiungibile da entrambi con questi filtri. Prova ad alzare il budget o a includere i voli con scalo."));
    return;
  }
  const labels = { a: state.nameA.trim() || "Tu", b: state.nameB.trim() || "Lei / Lui" };
  pane.append(el("p", { class: "pane-h" },
    (state.data.searched && state.data.searched < state.data.considered
      ? `Ho confrontato le ${state.data.searched} città più adatte (su ${state.data.considered}) con tariffe vere${state.data.partial ? ", ma il tempo è finito prima di controllarle tutte" : ""}. Le ${res.length} più economiche:`
      : `${state.data.count} città raggiungibili da entrambi. Ecco le ${res.length} più economiche.`),
    el("small", {}, `Prezzi per persona, ${state.roundTrip ? "andata e ritorno" : "sola andata"}.`)));
  const list = el("ol", { class: "list" });
  res.forEach((it, i) => list.append(row(it, i, labels)));
  pane.append(list);
  listEl = list;
}

function select(i, fromMap) {
  state.sel = i;
  if (listEl) [...listEl.querySelectorAll(".row")].forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
  paintMap({ draw: true });
  if (fromMap && listEl && listEl.children[i]) listEl.children[i].scrollIntoView({ block: "nearest", behavior: reduceMotion() ? "auto" : "smooth" });
}

// ---------- map ----------
// Web Mercator: the world is 1000 units wide (lon -180..180). Land and borders come from /world.json
// (Natural Earth 50m, simplified offline). Markers are sized in screen pixels through u = units per pixel.
const VW = 1000, VH = 660, ASP = VW / VH, R = VW / (2 * Math.PI);
const WORLD = { x: 0, y: -372, w: VW, h: VH };
const proj = (lat, lon) => ({ x: (lon + 180) * VW / 360, y: -R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) });
const recOf = o => (o && o.codes ? o.codes.map(c => cityByCode.get(c)).find(Boolean) : null);
const clamp = (n, a, b) => Math.min(Math.max(n, a), b);
const arc = (p, q) => {
  const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2, dx = q.x - p.x, dy = q.y - p.y;
  let nx = -dy, ny = dx;
  if (ny > 0) { nx = -nx; ny = -ny; } // bow the thread northwards
  const k = 0.18;
  return `M${p.x.toFixed(1)} ${p.y.toFixed(1)} Q${(mx + nx * k).toFixed(1)} ${(my + ny * k).toFixed(1)} ${q.x.toFixed(1)} ${q.y.toFixed(1)}`;
};

let landG = null, dynG = null, zoomBtn = null, curView = { ...WORLD }, flight = 0;
const mctx = document.createElement("canvas").getContext("2d");
const textW = (t, px, wt = 650) => { mctx.font = `${wt} ${px}px "Bricolage Grotesque", system-ui, sans-serif`; return mctx.measureText(t).width; };
const sameView = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y) + Math.abs(a.w - b.w) < 0.5;
const setView = v => { curView = v; mapSvg.setAttribute("viewBox", `${v.x.toFixed(2)} ${v.y.toFixed(2)} ${v.w.toFixed(2)} ${v.h.toFixed(2)}`); };

// The map element lives for the whole session; App() only moves it into the new page.
function ensureMap() {
  if (mapSvg) return;
  mapSvg = document.createElementNS(NS, "svg");
  mapSvg.setAttribute("role", "img");
  mapSvg.setAttribute("aria-label", "Mappa del mondo con le città di partenza e i punti d'incontro");
  mapSvg.setAttribute("viewBox", `${curView.x} ${curView.y} ${curView.w} ${curView.h}`);
  landG = document.createElementNS(NS, "g");
  dynG = document.createElementNS(NS, "g");
  mapSvg.append(landG, dynG);
  mapSvg.addEventListener("click", e => { const g = e.target.closest("[data-i]"); if (g) select(+g.dataset.i, true); });
  fetch("/world.json").then(r => r.json()).then(w => {
    landG.innerHTML = `<path class="land" d="${w.land}"/><path class="borders" d="${w.borders}"/>`;
  }).catch(() => {});
}

function content() {
  const A = recOf(state.a), B = recOf(state.b);
  const results = state.data && !state.loading ? state.data.results : [];
  const dests = results.map(r => cityByCode.get(r.destination.code));
  return { A, B, results, dests };
}

// Whole world when nothing is chosen or when asked; otherwise frame both origins and every result.
function targetView() {
  const { A, B, dests } = content();
  const pts = [A, B, ...dests].filter(Boolean).map(c => proj(c.lat, c.lon));
  if (!pts.length || state.mapMode === "world") return { ...WORLD };
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const padX = Math.max((maxX - minX) * 0.22, 12), padY = Math.max((maxY - minY) * 0.3, 12);
  let w = maxX - minX + 2 * padX, h = maxY - minY + 2 * padY;
  if (w / h > ASP) h = w / ASP; else w = h * ASP;
  w = clamp(w, 150, VW); h = w / ASP;
  return { w, h, x: clamp((minX + maxX) / 2 - w / 2, 0, VW - w), y: clamp((minY + maxY) / 2 - h / 2, WORLD.y, WORLD.y + VH - h) };
}

function flyTo(target, done) {
  cancelAnimationFrame(flight);
  const from = { ...curView };
  if (reduceMotion() || sameView(from, target)) { done(); return; }
  const cx0 = from.x + from.w / 2, cy0 = from.y + from.h / 2, cx1 = target.x + target.w / 2, cy1 = target.y + target.h / 2;
  const t0 = performance.now(), D = 850;
  const step = now => {
    const k = Math.min(1, (now - t0) / D), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    const w = Math.exp(Math.log(from.w) + (Math.log(target.w) - Math.log(from.w)) * e), h = w / ASP;
    const cx = cx0 + (cx1 - cx0) * e, cy = cy0 + (cy1 - cy0) * e;
    const v = { x: cx - w / 2, y: cy - h / 2, w, h };
    if (k < 1) { setView(v); renderDyn(v, { threads: false }); flight = requestAnimationFrame(step); } else done();
  };
  flight = requestAnimationFrame(step);
}

// o.anim: fly to the new framing; o.keep: leave the framing alone; o.draw: animate the threads in.
function paintMap(o = {}) {
  if (!mapSvg) return;
  cancelAnimationFrame(flight);
  const target = o.keep ? curView : targetView();
  const finish = () => { setView(target); renderDyn(target, { threads: true, draw: !!o.draw }); };
  if (o.anim && !o.keep) flyTo(target, finish); else finish();
  paintZoomBtn();
  paintCaption();
}

function renderDyn(v, o) {
  const cw = mapSvg.getBoundingClientRect().width || 600;
  const u = v.w / cw;
  const f = n => n.toFixed(2);
  const { A, B, results, dests } = content();
  const selIdx = results.length ? Math.min(state.sel, results.length - 1) : -1;
  const D = selIdx >= 0 ? dests[selIdx] : null;
  const inView = (p, m = 0) => p.x > v.x - m && p.x < v.x + v.w + m && p.y > v.y - m && p.y < v.y + v.h + m;
  const taken = [{ x0: v.x + v.w - 132 * u, x1: v.x + v.w, y0: v.y, y1: v.y + 48 * u }]; // keep the zoom button clear
  const hit = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
  const around = (p, r) => ({ x0: p.x - r * u, y0: p.y - r * u, x1: p.x + r * u, y1: p.y + r * u });
  const originLabels = [];
  const L = { dots: [], threads: [], rings: [], tags: [], pins: [], labels: [] };

  // quiet dots for every airport city that is not otherwise drawn
  const special = new Set([A && A.code, B && B.code, ...dests.map(c => c && c.code)]);
  for (const c of state.cities) {
    if (special.has(c.code)) continue;
    const p = proj(c.lat, c.lon);
    if (inView(p)) L.dots.push(`<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${f(2.4 * u)}" fill="var(--ink)" fill-opacity=".3"/>`);
  }

  // threads from each origin to the selected destination
  const pD = D ? proj(D.lat, D.lon) : null;
  if (pD && o.threads) {
    const draw = o.draw && !reduceMotion();
    [[A, "var(--a)", 0], [B, "var(--b)", 0.12]].forEach(([c, col, delay]) => {
      if (c) L.threads.push(`<path pathLength="1" class="thread${draw ? " draw" : ""}" style="animation-delay:${delay}s" d="${arc(proj(c.lat, c.lon), pD)}" stroke="${col}" stroke-width="${f(3.6 * u)}"/>`);
    });
  }

  // origin pins and their names
  const anchor = p => { const rx = (p.x - v.x) / v.w; return rx < 0.14 ? "start" : rx > 0.86 ? "end" : "middle"; };
  const label = (p, t, dy, size) => {
    const an = anchor(p), w = textW(t, size) * u, h = size * u, yb = p.y + dy * u;
    const x0 = an === "start" ? p.x : an === "end" ? p.x - w : p.x - w / 2;
    const lr = { x0, x1: x0 + w, y0: yb - h, y1: yb + 3 * u };
    if (taken.some(t => hit(lr, t))) return; // a name that would sit on top of another is left out
    taken.push(lr);
    L.labels.push(`<text x="${f(p.x)}" y="${f(yb)}" text-anchor="${an}" font-size="${f(size * u)}" font-weight="650" fill="var(--ink)" stroke-width="${f(4 * u)}">${esc(t)}</text>`);
  };
  [[A, "var(--a)", state.a], [B, "var(--b)", state.b]].forEach(([c, col, opt]) => {
    if (!c) return;
    const p = proj(c.lat, c.lon);
    if (!inView(p)) return;
    taken.push(around(p, 10));
    L.pins.push(`<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${f(8 * u)}" fill="${col}"/><circle cx="${f(p.x)}" cy="${f(p.y)}" r="${f(3 * u)}" fill="var(--surface)"/>`);
    originLabels.push(() => label(p, opt.city, -16, 14));
  });
  if (pD) {
    taken.push(around(pD, 14));
    L.pins.push(`<circle cx="${f(pD.x)}" cy="${f(pD.y)}" r="${f(12 * u)}" fill="var(--surface)" stroke="var(--ink)" stroke-width="${f(3 * u)}"/><circle cx="${f(pD.x)}" cy="${f(pD.y)}" r="${f(5 * u)}" fill="var(--ink)"/>`);
  }
  originLabels.forEach(fn => fn());
  dests.forEach((c, i) => { if (c && i !== selIdx) taken.push(around(proj(c.lat, c.lon), 7)); });

  // price tags: the selected one first, then cheapest to dearest; a tag is skipped when it cannot fit without overlap
  const free = r => !taken.some(t => hit(r, t)) && r.x0 >= v.x + 2 * u && r.x1 <= v.x + v.w - 2 * u && r.y0 >= v.y + 2 * u && r.y1 <= v.y + v.h - 2 * u;
  const place = (p, W, H) => {
    for (const d of [9, 24, 42]) {
      const g = d * u, s = d * 0.7 * u;
      const cands = [[g, -H / 2], [-g - W, -H / 2], [-W / 2, -g - H], [-W / 2, g], [s, -s - H], [-s - W, -s - H], [s, s], [-s - W, s]];
      for (const [dx, dy] of cands) {
        const r = { x0: p.x + dx, y0: p.y + dy, x1: p.x + dx + W, y1: p.y + dy + H, far: d > 9 };
        if (free(r)) return r;
      }
    }
    return null;
  };
  const order = results.map((_, i) => i).filter(i => dests[i] && i !== selIdx);
  if (selIdx >= 0 && dests[selIdx]) order.unshift(selIdx);
  for (const i of order) {
    const p = proj(dests[i].lat, dests[i].lon), sel = i === selIdx;
    if (!sel) {
      if (!inView(p)) continue;
      L.rings.push(`<g data-i="${i}" style="cursor:pointer"><title>${esc(results[i].destination.city)}</title><circle cx="${f(p.x)}" cy="${f(p.y)}" r="${f(15 * u)}" fill="transparent"/><circle cx="${f(p.x)}" cy="${f(p.y)}" r="${f(5.5 * u)}" fill="var(--surface)" stroke="var(--ink)" stroke-width="${f(1.6 * u)}"/></g>`);
    }
    const fs = sel ? 13 : 12, price = fmt(results[i].total, results[i].currency), txt = sel ? `${results[i].destination.city} ${price}` : price;
    const W = (textW(txt, fs) + 14) * u, H = (sel ? 26 : 20) * u;
    const r = place(p, W, H);
    if (!r && !sel) continue;
    const rr = r || { x0: p.x + 9 * u, y0: p.y - H / 2, x1: p.x + 9 * u + W, y1: p.y + H / 2 };
    taken.push(rr);
    if (rr.far) L.rings.push(`<line x1="${f(p.x)}" y1="${f(p.y)}" x2="${f(clamp(p.x, rr.x0, rr.x1))}" y2="${f(clamp(p.y, rr.y0, rr.y1))}" stroke="rgba(18,38,58,.5)" stroke-width="${f(u)}"/>`);
    L.tags.push(`<g data-i="${i}" style="cursor:pointer"><title>${esc(results[i].destination.city)}</title><rect x="${f(rr.x0)}" y="${f(rr.y0)}" width="${f(W)}" height="${f(H)}" rx="${f(5 * u)}" fill="${sel ? "var(--ink)" : "var(--surface)"}" stroke="${sel ? "none" : "rgba(18,38,58,.55)"}" stroke-width="${f(u)}"/><text class="tt" x="${f(rr.x0 + W / 2)}" y="${f(rr.y0 + H / 2)}" text-anchor="middle" dominant-baseline="central" font-size="${f(fs * u)}" font-weight="650" fill="${sel ? "var(--paper)" : "var(--ink)"}">${esc(txt)}</text></g>`);
  }
  dynG.innerHTML = [L.dots, L.threads, L.rings, L.tags, L.pins, L.labels].map(a => a.join("")).join("");
}

function paintZoomBtn() {
  if (!zoomBtn) return;
  const { A, B, dests } = content();
  zoomBtn.hidden = ![A, B, ...dests].some(Boolean);
  zoomBtn.textContent = state.mapMode === "world" ? "Avvicina" : "Vedi il mondo";
}

function paintCaption() {
  if (!capEl) return;
  const { results } = content();
  const selIdx = results.length ? Math.min(state.sel, results.length - 1) : -1;
  let cap;
  if (selIdx >= 0 && state.a && state.b) {
    const r = results[selIdx];
    cap = `<strong>${esc(state.a.city)}</strong> e <strong>${esc(state.b.city)}</strong> si incontrano a <strong>${esc(r.destination.city)}</strong>: ${esc(fmt(r.total, r.currency))} in due.`;
  } else if (state.a && state.b) {
    cap = `${esc(state.a.city)} e ${esc(state.b.city)}. Premi “Trova dove vederci” per cercare la città dove spendete meno.`;
  } else if (state.a || state.b) {
    cap = `${esc((state.a || state.b).city)} è sulla mappa. Ora scegli l'altra città.`;
  } else {
    cap = "Le due città compaiono qui appena le scegli.";
  }
  capEl.innerHTML = cap;
}

// ---------- provider badge (updated in place) ----------
function paintProvider() {
  const b = document.getElementById("prov"), f = document.getElementById("foot-note");
  if (b) { b.hidden = !state.provider; b.classList.toggle("live", isLive()); b.textContent = isLive() ? "Tariffe reali" : "Prezzi di prova"; }
  if (f) f.textContent = isLive() ? "Tariffe reali da Duffel." : (state.testMode ? "Duffel è in modalità test: i prezzi non sono reali." : "Prezzi di prova. Con un fornitore reale collegato diventano tariffe vere.");
}

// ---------- page ----------
const root = document.getElementById("root");

function App(animate) {
  root.innerHTML = "";
  closers.clear();
  const wrap = el("div", { class: "wrap" });

  wrap.append(el("header", { class: "top" },
    el("div", { class: "brand-line" },
      el("a", { class: "brand", href: "/" }, el("span", { class: "mark", "aria-hidden": "true" }, el("i", { class: "ma" }), el("i", { class: "mb" })), "MidPoint"),
      el("span", { class: "tag" }, "per chi ha gli amici in un'altra città")),
    el("span", { id: "prov", class: "mode" })));

  const go = el("button", { class: "go", type: "submit" }, state.loading ? "Cerco…" : "Trova dove vederci");
  const warn = el("p", { class: "warn", role: "alert" }, "Scegli due città di partenza diverse.");
  const refreshGo = () => {
    const ok = state.a && state.b && !sameCity() && state.depart;
    go.disabled = !(ok && !state.loading);
    warn.hidden = !sameCity();
  };
  const onCity = kind => { refreshGo(); paintMap(kind === "type" ? { keep: true } : { anim: true }); };

  const title = el("h1", { class: "ask-title" },
    "Da ", cityInput("a", "la tua città", "Prima città di partenza", onCity),
    " e da ", cityInput("b", "la sua città", "Seconda città di partenza", onCity),
    ", dove ci vediamo?");

  const dDep = el("input", { type: "date", value: state.depart, min: todayISO(), "aria-label": "Data di andata" });
  const dRet = el("input", { type: "date", value: state.ret, min: state.depart, "aria-label": "Data di ritorno" });
  dDep.addEventListener("change", e => {
    state.depart = e.target.value; dRet.min = state.depart;
    if (state.ret < state.depart) { state.ret = state.depart; dRet.value = state.ret; }
    refreshGo();
  });
  dRet.addEventListener("change", e => { state.ret = e.target.value; });
  const bud = el("input", { type: "number", inputmode: "numeric", min: "0", placeholder: "nessun limite", value: state.budget, "aria-label": "Budget massimo totale in euro" });
  const eur = el("span", {}, state.budget ? " €" : "");
  bud.addEventListener("input", e => { state.budget = e.target.value; eur.textContent = state.budget ? " €" : ""; });
  const tRT = el("button", { type: "button", class: "t", onclick: () => { state.roundTrip = !state.roundTrip; App(); } }, state.roundTrip ? "solo andata" : "Vuoi aggiungere il ritorno");
  const tNS = el("button", { type: "button", class: "t", onclick: () => { state.nonStop = !state.nonStop; App(); } }, state.nonStop ? "solo voli diretti" : "voli diretti e con scalo");
  const when = el("p", { class: "when" },
    el("span", { class: "ln" }, "Si parte il ", dDep,
      state.roundTrip ? [" e si torna il ", dRet, ", oppure ", tRT, "."] : [", solo andata. ", tRT, "?"]),
    el("span", { class: "ln" }, "Budget totale per voi due: ", bud, eur),
    el("span", { class: "ln" }, "Cerco ", tNS, "."));

  const nA = el("input", { value: state.nameA, "aria-label": "Nome del primo viaggiatore" });
  const nB = el("input", { value: state.nameB, "aria-label": "Nome del secondo viaggiatore" });
  nA.addEventListener("input", e => { state.nameA = e.target.value; });
  nB.addEventListener("input", e => { state.nameB = e.target.value; });
  const names = el("p", { class: "names" },
    "Nei risultati vi chiamo",
    el("label", {}, el("span", { class: "sw a" }), nA), "e",
    el("label", {}, el("span", { class: "sw b" }), nB));

  const ex = el("p", { class: "try" }, "Per provare: ");
  EXAMPLES.forEach(([x, y], i) => {
    ex.append(el("button", { type: "button", class: "t", onclick: () => useExample(x, y) }, `${x} e ${y}`));
    if (i < EXAMPLES.length - 1) ex.append(", ");
  });
  ex.append(".");

  wrap.append(el("form", { class: "ask", novalidate: "", onsubmit: e => { e.preventDefault(); run(); } }, title, when, names, go, warn, ex));

  // map + results
  const pane = el("div", { class: "pane" });
  fillPane(pane);
  ensureMap();
  zoomBtn = el("button", { type: "button", class: "zoom", onclick: () => { state.mapMode = state.mapMode === "world" ? "fit" : "world"; paintMap({ anim: true }); } });
  capEl = el("p", { class: "cap" });
  wrap.append(el("section", { class: "board", id: "board", "aria-live": "polite" }, pane,
    el("div", { class: "map-wrap" }, el("div", { class: "map" }, mapSvg, zoomBtn), capEl)));

  wrap.append(el("footer", { class: "foot" },
    el("span", {}, "Fatto per scegliere dove vedersi senza litigare sul prezzo."),
    el("span", { id: "foot-note" })));

  root.append(wrap);
  refreshGo();
  paintMap({ anim: true, draw: !!animate });
  paintProvider();
}

const scrollToBoard = () => {
  const b = document.getElementById("board");
  if (b) b.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" });
};

async function useExample(x, y) {
  const [ra, rb] = await Promise.all([API.search(x), API.search(y)]);
  if (!ra[0] || !rb[0]) return;
  state.a = ra[0]; state.textA = ra[0].text; state.b = rb[0]; state.textB = rb[0].text;
  state.data = null; state.error = ""; state.sel = 0; state.mapMode = "fit";
  App();
}

async function run() {
  if (!(state.a && state.b && !sameCity() && state.depart)) return;
  state.loading = true; state.error = ""; state.data = null; state.sel = 0; state.mapMode = "fit";
  App(); scrollToBoard();
  try {
    const res = await API.meeting({
      originA: state.a.codes, originB: state.b.codes, departDate: state.depart,
      returnDate: state.roundTrip ? state.ret : null, nonStop: state.nonStop,
      maxTotalBudget: state.budget ? Number(state.budget) : null, limit: 12
    });
    state.data = res; if (res.provider) state.provider = res.provider;
  } catch (e) { state.error = e.message; }
  finally { state.loading = false; App(true); }
}

let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => paintMap({}), 120); });

App();
API.cities().then(list => {
  state.cities = list;
  list.forEach(c => c.codes.forEach(code => cityByCode.set(code, c)));
  paintMap({});
});
API.provider().then(p => { if (p) { state.provider = p; paintProvider(); } });
</script>
</body>
</html>
